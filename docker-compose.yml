# Mosquitto (MQTT), Prometheus, Grafana, Python; Lambda = local emulator (default), AWS Lambda ('aws' profile) or an open FaaS.
# 'experiment' = simulator + gateway + local FaaS emulator under hard CPU/memory limits.
# Profile 'faas' adds the same handler as an HTTP function container (OpenFaaS/Knative-compatible);
# run experiments against it with:  --backend faas --faas-url http://function:8080 --postgres-dsn <dsn>
services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes: ["./infra/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
    ports: ["1883:1883"]

  experiment:
    build: .
    depends_on: [mosquitto]
    cpus: 1.0          # set 0.5 / 0.25 to model weaker edge hardware
    mem_limit: 512m
    cap_add: [NET_ADMIN]   # lets infra/netem.sh shape this container's interface
    volumes: ["./results:/app/results"]
    ports: ["8000:8000"]

  # Edge node (CPU/memory limited) -> real AWS Lambda + DynamoDB. Deploy first:  python aws/deploy.py deploy
  # Run:  AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_DEFAULT_REGION=... docker compose --profile aws up --build experiment-aws
  experiment-aws:
    profiles: ["aws"]
    build: .
    depends_on: [mosquitto]
    cpus: 1.0
    mem_limit: 512m
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-2}
    command: ["python", "run_experiments.py", "--out", "results_aws", "--extra", "--backend", "aws",
              "--transport", "mqtt", "--mqtt-host", "mosquitto", "--aws-region", "${AWS_DEFAULT_REGION:-ap-southeast-2}"]
    volumes: ["./results_aws:/app/results_aws"]

  postgres:
    profiles: ["faas"]
    image: postgres:16
    environment: {POSTGRES_PASSWORD: iot, POSTGRES_DB: iot}
    ports: ["5432:5432"]

  function:
    profiles: ["faas"]
    build: .
    command: ["python", "lambda_fn/server.py", "8080"]
    environment:
      STORE_BACKEND: postgres
      POSTGRES_DSN: postgresql://postgres:iot@postgres:5432/iot
      PYTHONPATH: /app/lambda_fn
    depends_on: [postgres]
    cpus: 1.0
    mem_limit: 256m
    ports: ["8080:8080"]

  prometheus:
    image: prom/prometheus
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
